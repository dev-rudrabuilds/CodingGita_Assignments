<!DOCTYPE html>
<html>

<head>
    <title>My First JavaScript Page</title>
</head>

<body>
    <h1>My First JavaScript Page</h1> <button id="clickBtn">Click Me</button>
    <script> console.log("JavaScript is running successfully!"); document.getElementById("clickBtn").addEventListener("click", function () { alert("Hello, B.Tech Student!"); document.body.style.backgroundColor = "lightblue"; }); </script>
</body>
</html>


<!-- Working:
The page displays the heading "My First JavaScript Page" and a "Click Me" button.
When the button is clicked, an alert displays "Hello, B.Tech Student!" and the page background changes to light blue.
"JavaScript is running successfully!" is printed in the browser console. -->
