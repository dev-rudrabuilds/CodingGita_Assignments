<!DOCTYPE html>
<html>

<head>
    <title>JavaScript Alert</title>
</head>

<body>
    <button onclick="showMessage()">Click Me</button>


    <script>
        function showMessage() {
            alert("Welcome to JavaScript!")
        }
    </script>
</body>
</html>

<!-- Output: Clicking the button displays an alert box containing "Welcome to JavaScript!". -->
